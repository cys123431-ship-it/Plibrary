name: Build Windows EXE and Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'PLibrary.spec'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        shell: pwsh
        env:
          PYTHONPATH: src
        run: pytest -q

      - name: Build single-file Windows app
        shell: pwsh
        run: pyinstaller PLibrary.spec --noconfirm --clean

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\dist\PLibrary.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  PLibrary.exe" | Out-File -FilePath SHA256SUMS.txt -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PLibrary-windows
          path: |
            dist/PLibrary.exe
            SHA256SUMS.txt

      - name: Create GitHub Release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.1.${{ github.run_number }}"
          gh release create $tag .\dist\PLibrary.exe .\SHA256SUMS.txt `
            --target "${{ github.sha }}" `
            --title "PLibrary $tag" `
            --notes-file RELEASE_NOTES.md
